[package]
name = "vibestats"
version = "0.1.0"
description = "Local dashboard for Claude Code + Codex usage"
authors = ["Rico Trebeljahr"]
license = "MIT"
repository = "https://github.com/trebeljahr/vibestats"
edition = "2021"

[lib]
name = "vibestats_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset"] }
tauri-plugin-shell = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"

[dev-dependencies]
tauri = { version = "2", features = ["test"] }
