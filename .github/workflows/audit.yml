# Security audit — npm + cargo advisory scan on every PR and weekly.
#
# Fails the run if any high-severity (or worse) advisory affects a direct or
# transitive dependency. Weekly cron catches newly-disclosed CVEs in deps that
# haven't changed locally.

name: Security Audit

on:
  pull_request:
  schedule:
    - cron: '0 8 * * 1'  # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-audit:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        dir: ['.', 'site']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22

      - name: Ensure package-lock.json (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: |
          if [ ! -f package-lock.json ]; then
            npm install --package-lock-only --no-audit --no-fund
          fi

      - name: npm audit (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: npm audit --audit-level=high

  cargo-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo-audit binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-bin-v1

      - name: Install cargo-audit (if missing)
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi

      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
