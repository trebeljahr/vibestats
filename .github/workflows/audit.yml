# Security audit — pnpm + cargo advisory scan on every PR and weekly.
#
# Fails the run if any high-severity (or worse) advisory affects a direct or
# transitive dependency. Weekly cron catches newly-disclosed CVEs in deps that
# haven't changed locally.

name: Security Audit

on:
  pull_request:
  schedule:
    - cron: '0 8 * * 1'  # Mondays 08:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pnpm-audit:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        dir: ['.', 'site']
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      # No `version:` input: pnpm/action-setup reads `packageManager` from package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413  # v6.1.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      - name: pnpm audit (${{ matrix.dir }})
        working-directory: ${{ matrix.dir }}
        run: pnpm audit --audit-level=high

  cargo-audit:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable

      - name: Cache cargo-audit binary
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: ~/.cargo/bin/cargo-audit
          key: cargo-audit-bin-v1

      - name: Install cargo-audit (if missing)
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install cargo-audit --locked
          fi

      # Known warnings (unmaintained/unsound, not vulnerabilities, so they do
      # not fail the run): glib 0.18 + proc-macro-error via gtk-rs 0.18 on
      # Linux, and the unic-* crates via urlpattern 0.3 in tauri-utils. All
      # come from Tauri itself and clear when Tauri moves off those versions.
      - name: cargo audit
        working-directory: src-tauri
        run: cargo audit
