# Cross-platform Tauri build + npm publish on tag push.
#
# Triggered when you push a tag matching v*.*.* (release scripts do this).
# Builds Tauri binaries for macOS (arm64 + x64), Windows, Linux and attaches
# them to a GitHub release. Then publishes the npm package.
#
# npm: no token. publish-npm uses npm trusted publishing (GitHub OIDC), set up
# once with `npm trust github @trebeljahr/vibestats --repo trebeljahr/vibestats
# --file release.yml`. It skips the publish when the version is already on npm.
#
# Optional for signed + notarized macOS builds:
#   APPLE_CERTIFICATE  base64 of the Developer ID Application .p12
#   APPLE_CERTIFICATE_PASSWORD
#   APPLE_SIGNING_IDENTITY
#   APPLE_TEAM_ID
#   APPLE_API_ISSUER, APPLE_API_KEY, APPLE_API_KEY_P8_BASE64
#     App Store Connect API key used for notarization
#   TAURI_SIGNING_PRIVATE_KEY + _PASSWORD (for auto-update signing)

name: Release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write
  id-token: write  # required for npm provenance (publish-npm job)

jobs:
  build-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8  # stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: cargo-${{ matrix.target }}-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: cargo-${{ matrix.target }}-

      - name: Linux deps
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev

      - name: npm install
        run: npm install --no-audit --no-fund

      - name: Write App Store Connect API key for notarization
        if: startsWith(matrix.os, 'macos')
        env:
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8_BASE64" ]; then
            key_path="$RUNNER_TEMP/AuthKey.p8"
            echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$key_path"
            echo "APPLE_API_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          fi

      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f  # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Vibestats ${{ github.ref_name }}'
          releaseBody: 'See CHANGELOG for details.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.target == 'aarch64-apple-darwin' && '--target aarch64-apple-darwin' || matrix.target == 'x86_64-apple-darwin' && '--target x86_64-apple-darwin' || '' }}

  publish-npm:
    needs: build-tauri
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install -g npm@11.6.2
      - name: Publish unless this version is already on npm
        run: |
          version=$(node -p "require('./package.json').version")
          if npm view "@trebeljahr/vibestats@$version" version >/dev/null 2>&1; then
            echo "@trebeljahr/vibestats@$version is already on npm, skipping publish."
          else
            npm publish --provenance --access public
          fi
